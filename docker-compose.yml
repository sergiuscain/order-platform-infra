services:
  # --- INVENTORY SERVICE ---
  postgres-inventory:
    image: postgres:17-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB}
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_POSTGRES_USER} -d ${INVENTORY_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  inventory-api:
    image: ghcr.io/sergiuscain/inventoryservice:latest
    container_name: inventory-api
    depends_on:
      postgres-inventory:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres-inventory;Port=5432;Database=${INVENTORY_POSTGRES_DB};Username=${INVENTORY_POSTGRES_USER};Password=${INVENTORY_POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      RabbitMQ__Host: rabbitmq
    networks:
      - backend

  # --- ORDER SERVICE ---
  postgres-order:
    image: postgres:17-alpine
    container_name: order-postgres
    environment:
      POSTGRES_USER: ${ORDER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ORDER_POSTGRES_DB}
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_POSTGRES_USER} -d ${ORDER_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  order-api:
    image: ghcr.io/sergiuscain/orderservice:latest
    container_name: order-api
    depends_on:
      postgres-order:
        condition: service_healthy
      inventory-api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres-order;Port=5432;Database=${ORDER_POSTGRES_DB};Username=${ORDER_POSTGRES_USER};Password=${ORDER_POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      InventoryService__BaseUrl: http://inventory-api:8080
      RabbitMQ__Host: rabbitmq
    networks:
      - backend

  # --- AUTH SERVICE ---
  postgres-auth:
    image: postgres:17-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER} -d ${AUTH_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  auth-api:
    image: ghcr.io/sergiuscain/authservice:latest
    container_name: auth-api
    depends_on:
      postgres-auth:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 8080
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      ConnectionStrings__DefaultConnection: Host=postgres-auth;Port=5432;Database=${AUTH_POSTGRES_DB};Username=${AUTH_POSTGRES_USER};Password=${AUTH_POSTGRES_PASSWORD};GSS Encryption Mode=Disable
    networks:
      - backend

  # --- NOTIFICATION SERVICE ---
  notification-api:
    image: ghcr.io/sergiuscain/notificationservice:latest
    container_name: notification-api
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 8080
      RabbitMQ__Host: rabbitmq
    networks:
      - backend

  # --- INFRASTRUCTURE ---
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # --- API GATEWAY ---
  api-gateway:
    image: ghcr.io/sergiuscain/apigateway:latest
    container_name: api-gateway
    depends_on:
      order-api:
        condition: service_started
      inventory-api:
        condition: service_started
      auth-api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "8080:8080"
    networks:
      - backend

volumes:
  inventory_postgres_data:
  order_postgres_data:
  auth_postgres_data:

networks:
  backend:
    driver: bridge